version: '3.7'

services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: xuxu
      POSTGRES_USER: postgres
      POSTGRES_DB: picpaydb
    deploy:
       resources:
         limits:
           memory: 4096M
         reservations:
           memory: 2048M
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
    driver: local